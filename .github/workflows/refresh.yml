name: Refresh Official Dataset

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-dataset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore reproducible baseline
        run: npm run snapshot:restore
      - name: Reconcile official page index, JSON feeds, and detail abstracts
        run: npm run collect:pages
      - run: npm test
      - run: npm run validate
      - name: Preserve new raw snapshot
        run: npm run snapshot:create
      - name: Commit validated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh official NeurIPS snapshot'
            git push
          fi
      - name: Explicitly trigger publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Snapshot summary
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('public/data/manifest.json'));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify({entries:m.totalPapers,uniqueTitles:m.uniqueTitles,pageIndexEntries:m.pageIndexEntries,jsonOnlyEntries:m.jsonOnlyEntries,abstracts:m.abstractsAvailable,missing:m.abstractsMissing,detailAbstracts:m.abstractsBySource?.['official-poster-page']},null,2))"
